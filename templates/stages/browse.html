<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse — Social Media Archiver</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/base.css" />
  <script defer src="/static/js/browse.js?v=6"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="flex flex-col h-screen overflow-hidden" x-data="page()" x-init="init()" x-cloak>
  {% include "_nav.html" %}

  <div class="flex-1 overflow-auto px-4 pt-6 pb-8" x-ref="scroller">
    <div class="stage-header mb-5">
      <h1>Browse</h1>
      <p>Browse everything you've already archived.</p>
    </div>

    <!-- Key stats — same borderless row as index/account. -->
    <div class="stats-bar mb-5">
      <div class="stat-item">
        <span class="label">Accounts</span>
        <span class="value" x-text="stats.total_accounts ?? '—'"></span>
      </div>
      <div class="stat-item">
        <span class="label">Total Posts</span>
        <span class="value" x-text="stats.total_posts ?? '—'"></span>
      </div>
      <div class="stat-item">
        <span class="label">Images</span>
        <span class="value" x-text="stats.total_images ?? '—'"></span>
      </div>
      <div class="stat-item">
        <span class="label">Videos</span>
        <span class="value" x-text="stats.total_videos ?? '—'"></span>
      </div>
    </div>

    <div class="panel p-4 mb-5">
      <h2 class="panel-title">Search</h2>
      <div class="flex gap-2">
        <input type="text" class="field-input" placeholder="Search archived post text…"
               x-model="query" @keyup.enter="search()" style="max-width:360px" />
        <button @click="search()" class="stage-actions">
          Search
        </button>
      </div>
      <!-- Filters are shared: they narrow the search and the export alike. -->
      <div class="flex gap-2 flex-wrap mt-2">
        <select class="field-input" x-model="filters.platform" style="max-width:150px">
          <option value="">Any platform</option>
          <template x-for="p in platforms" :key="p">
            <option :value="p" x-text="p"></option>
          </template>
        </select>
        <input type="text" class="field-input" placeholder="Any account"
               x-model="filters.account" @keyup.enter="search()" style="max-width:150px" />
        <input type="date" class="field-input" x-model="filters.since" style="max-width:150px" title="Posted on or after" />
        <input type="date" class="field-input" x-model="filters.until" style="max-width:150px" title="Posted on or before" />
        <button @click="exportResults()" class="stage-actions"
                :disabled="exporting" x-text="exporting ? 'Exporting…' : 'Export these results'"></button>
      </div>
      <p class="field-error mt-2" x-show="searchError" x-text="searchError"></p>
      <template x-if="searched && !searchError">
        <p class="text-faint text-xs mt-2" x-text="results.length + ' of ' + searchTotal + ' match(es)'"></p>
      </template>
      <template x-if="exportMsg">
        <p class="text-faint text-xs mt-2" x-text="exportMsg"></p>
      </template>
      <div class="mt-2 space-y-1.5" x-show="results.length > 0">
        <template x-for="r in results" :key="r.platform + ':' + r.post_id">
          <a :href="'/account/' + r.platform + '/' + r.account + '#post-' + r.post_id" class="block panel-band p-2 text-xs" style="text-decoration:none;color:var(--text)">
            <span class="text-faint" x-text="'[' + r.platform + '] ' + handle(r.account) + '  ' + (r.posted_at || '')"></span>
            <div x-text="r.snippet"></div>
          </a>
        </template>
      </div>
      <!-- Infinite-scroll sentinel: hidden until there are results, so it can
           only come into view at the bottom of a non-empty list. -->
      <div x-ref="sentinel" x-show="results.length > 0" class="text-faint text-xs mt-2"
           x-text="searching ? 'Loading more…' : (hasMore ? '' : 'End of results')"></div>
    </div>

    <h2 class="panel-title">Archived accounts</h2>
    <div id="accounts-container">
      <template x-if="loading">
        <p class="text-faint text-xs">Loading accounts…</p>
      </template>
      <template x-if="!loading && accounts.length === 0">
        <div class="panel p-5">
          <h3 class="text-sm font-semibold text-heading mb-1">No archived accounts yet</h3>
          <p class="text-muted text-xs">
            Head to <a class="link" href="/run">Run</a> to start a crawl,
            or <a class="link" href="/configure">Configure</a> to pick what to archive.
          </p>
        </div>
      </template>
      <div x-show="!loading && accounts.length > 0" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
        <template x-for="account in accounts" :key="account.platform + ':' + account.account">
          <div class="account-card">
            <span class="platform" x-text="account.platform"></span>
            <h3 x-text="handle(account.account)"></h3>
            <div class="stats" x-text="(account.post_count ?? 0) + ' posts'"></div>
            <a :href="'/account/' + account.platform + '/' + account.account" class="view-btn">View Posts</a>
          </div>
        </template>
      </div>
    </div>
  </div>
</body>
</html>
