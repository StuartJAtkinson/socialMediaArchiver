<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse — Social Media Archiver</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/base.css" />
  <script defer src="/static/js/browse.js?v=1"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="flex flex-col h-screen overflow-hidden" x-data="page()" x-init="init()" x-cloak>
  {% with stage_actions = '' %}
    {% include "_nav.html" %}
  {% endwith %}

  <div class="flex-1 overflow-auto px-4 pt-6 pb-8">
    <div class="stage-header mb-5">
      <h1>Browse</h1>
      <p>Browse everything you've already archived.</p>
    </div>

    <!-- Key stats — same borderless row as index/account. -->
    <div class="stats-bar mb-5">
      <div class="stat-item">
        <span class="label">Accounts</span>
        <span class="value" x-text="stats.total_accounts ?? '—'"></span>
      </div>
      <div class="stat-item">
        <span class="label">Total Posts</span>
        <span class="value" x-text="stats.total_posts ?? '—'"></span>
      </div>
      <div class="stat-item">
        <span class="label">Images</span>
        <span class="value" x-text="stats.total_images ?? '—'"></span>
      </div>
      <div class="stat-item">
        <span class="label">Videos</span>
        <span class="value" x-text="stats.total_videos ?? '—'"></span>
      </div>
    </div>

    <div class="panel p-4 mb-5">
      <h2 class="text-sm font-semibold text-white mb-2">Search</h2>
      <div class="flex gap-2">
        <input type="text" class="field-input" placeholder="Search archived post text…"
               x-model="query" @keyup.enter="search()" style="max-width:360px" />
        <button @click="search()"
                style="color:var(--accent-fg);background:var(--accent-bg);border:1px solid var(--accent-border);border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer;">
          Search
        </button>
      </div>
      <template x-if="searched && !searching">
        <p class="text-xs mt-2" style="color:var(--faint)" x-text="results.length + ' of ' + searchTotal + ' match(es)'"></p>
      </template>
      <div class="mt-2 space-y-1.5" x-show="results.length > 0">
        <template x-for="r in results" :key="r.platform + ':' + r.post_id">
          <a :href="'/account/' + r.platform + '/' + r.account" class="block panel-band p-2 text-xs" style="text-decoration:none;color:var(--text)">
            <span style="color:var(--faint)" x-text="'[' + r.platform + '] @' + r.account + '  ' + (r.posted_at || '')"></span>
            <div x-text="r.snippet"></div>
          </a>
        </template>
      </div>
    </div>

    <h2 class="text-sm font-semibold text-white mb-2">Archived accounts</h2>
    <div id="accounts-container">
      <template x-if="loading">
        <p class="text-xs" style="color:var(--faint)">Loading accounts…</p>
      </template>
      <template x-if="!loading && accounts.length === 0">
        <div class="panel p-5">
          <h3 class="text-sm font-semibold text-white mb-1">No archived accounts yet</h3>
          <p class="text-xs" style="color:var(--muted)">
            Head to <a href="/run" style="color:var(--accent)">Run</a> to start a crawl,
            or <a href="/configure" style="color:var(--accent)">Configure</a> to pick what to archive.
          </p>
        </div>
      </template>
      <div x-show="!loading && accounts.length > 0" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
        <template x-for="account in accounts" :key="account.platform + ':' + account.account">
          <div class="account-card">
            <span class="platform" x-text="account.platform"></span>
            <h3 x-text="'@' + account.account"></h3>
            <div class="stats" x-text="(account.post_count ?? 0) + ' posts'"></div>
            <a :href="'/account/' + account.platform + '/' + account.account" class="view-btn">View Posts</a>
          </div>
        </template>
      </div>
    </div>
  </div>
</body>
</html>
